<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="profilePIC.jpg" type="image/x-icon">
    <title>Nima Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }
        
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #667eea;
            background-image    : url('profilePIC.jpg');
            background-size: cover;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 50px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .title {
            color: #667eea;
            font-size: 16px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        
        .bio {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .info-item {
            flex: 1;
        }
        
        .info-item strong {
            display: block;
            color: #667eea;
            font-size: 18px;
            margin-bottom: 5px;
        }
        
        .info-item span {
            color: #999;
            font-size: 12px;
        }
        
        .social {
            margin:auto;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            font-weight: bold;
        }
        
        .social a {
            display: block;
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            padding: 12px ;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px ;
            text-decoration: none;
          
         
        }
        
        .social a:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 10px;
        }
        
        .btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-pic"></div>
        <h1>Nima Hamouda</h1>
        <p class="title">Web Developer | Designer</p>
        <p class="bio">Passionate about creating beautiful and functional web experiences. Always learning and exploring new technologies.</p>
        
        <div class="info">
            <div class="info-item">
                <strong>50+</strong>
                <span>Posts</span>
            </div>
            <div class="info-item">
                <strong>4K+</strong>
                <span>Followers</span>
            </div>
            <div class="info-item">
                <strong>5+</strong>
                <span>Years Exp</span>
            </div>
        </div>
        
        <div class="social">
            <a href="https://github.com/nimahamoda2" title="GitHub" >GitHub🐙</a>
            <a href="https://www.instagram.com/na3na3.h" title="Instagram" >Instagram 📸</a>
            <a href="https://www.facebook.com/share/1DdQoLkE3Y/" title="Facebook" >Facebook💼</a>
            <a href="https://www.tiktok.com/@na3um" title="TikTok" >TikTok🐦</a>
            <a href="#" title="YouTube" >YouTube✉️</a>
        </div>
       
    </div>
</body>
</html>
